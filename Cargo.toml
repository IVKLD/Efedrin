[package]
name = "efedrin"
version = "0.1.0"
edition = "2021"
authors = ["Igni <igni@desktop>"]
description = "Production-ready PipeWire soundpad for Linux with dual-routing into headphones and virtual microphone"
license = "MIT OR Apache-2.0"

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
which = "7.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
